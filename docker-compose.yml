services:
  db:
    image: postgres:16
    container_name: smokeguard-platform-db
    environment:
      POSTGRES_USER: smokeguard
      POSTGRES_PASSWORD: smokeguard123
      POSTGRES_DB: smokeguard_platform
    ports:
      - "5434:5432"
    volumes:
      - platform-db-data:/var/lib/postgresql/data

volumes:
  platform-db-data:
